<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>viz test</title>
<style>
:root{--accent:#4f8cff;--accent-fg:#fff;--bad:#e5484d}
body{background:#111;color:#fff;font-family:system-ui;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center;min-height:100vh;margin:0}
.mic{border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:600;padding:11px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;position:relative;--mic-level:0;transition:box-shadow .2s ease,transform .12s ease-out,background-color .25s ease}
.mic[aria-pressed="true"]{background:var(--bad);color:#fff}
.mic.live{box-shadow:0 0 0 calc(2px + var(--mic-level)*3px) color-mix(in srgb,var(--accent) 50%,transparent),0 0 calc(12px + var(--mic-level)*38px) calc(3px + var(--mic-level)*9px) color-mix(in srgb,var(--accent) 70%,transparent);transform:scale(calc(1 + var(--mic-level)*0.05))}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.9;transition:transform .12s ease-out}
.mic.live .dot{transform:scale(calc(1 + var(--mic-level)*0.9))}
#lvl{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<button class="mic" id="micBtn" aria-pressed="false"><span class="dot"></span><span id="micLabel">Start Talking</span></button>
<div id="lvl">level: 0.000</div>
<script>
const $ = id => document.getElementById(id);
/* exact copy of viz module, source = oscillator with LFO (simulated voice) */
let vizAn = null, vizData = null, vizRaf = 0, vizLevel = 0, vizGen = 0;
let simCtx = null;
async function vizStart(){
  const gen = ++vizGen;
  if (vizRaf) return;
  $("micBtn").classList.add("live");
  try {
    if (!vizAn) {
      simCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = simCtx.createOscillator(); osc.frequency.value = 220;
      const g = simCtx.createGain(); g.gain.value = 0.5;
      const lfo = simCtx.createOscillator(); lfo.frequency.value = 1.7;
      const lfoG = simCtx.createGain(); lfoG.gain.value = 0.5;
      lfo.connect(lfoG); lfoG.connect(g.gain);
      vizAn = simCtx.createAnalyser();
      osc.connect(g); g.connect(vizAn);
      osc.start(); lfo.start();
      vizAn.fftSize = 512;
      vizAn.smoothingTimeConstant = 0.45;
      vizData = new Uint8Array(vizAn.fftSize);
      try { if (vizAn.context.state === "suspended") await vizAn.context.resume(); } catch(e){}
      if (gen !== vizGen) throw 0;
    }
    vizTick();
  } catch(e){ $("micBtn").classList.remove("live"); vizCleanup(); }
}
function vizTick(){
  if (!vizAn) return;
  vizAn.getByteTimeDomainData(vizData);
  let sum = 0;
  for (let i = 0; i < vizData.length; i++){ const v = (vizData[i] - 128) / 128; sum += v * v; }
  const target = Math.min(1, Math.sqrt(sum / vizData.length) * 3.5);
  vizLevel += (target - vizLevel) * (target > vizLevel ? 0.45 : 0.2);
  $("micBtn").style.setProperty("--mic-level", vizLevel.toFixed(3));
  $("lvl").textContent = "level: " + vizLevel.toFixed(3);
  vizRaf = requestAnimationFrame(vizTick);
}
function vizStop(hard){
  const gen = ++vizGen;
  if (vizRaf){ cancelAnimationFrame(vizRaf); vizRaf = 0; }
  const btn = $("micBtn");
  if (hard){ vizLevel = 0; btn.style.setProperty("--mic-level", "0"); btn.classList.remove("live"); vizCleanup(); return; }
  const fade = () => {
    if (gen !== vizGen) return;
    vizLevel *= 0.78;
    btn.style.setProperty("--mic-level", vizLevel.toFixed(3));
    if (vizLevel > 0.015) requestAnimationFrame(fade);
    else { btn.style.setProperty("--mic-level", "0"); btn.classList.remove("live"); vizCleanup(); }
  };
  fade();
}
function vizCleanup(){
  try { vizAn && vizAn.disconnect(); } catch(e){}
  try { simCtx && simCtx.close(); } catch(e){}
  vizAn = vizData = null; simCtx = null; vizLevel = 0;
}
let on = false;
$("micBtn").addEventListener("click", () => {
  on = !on;
  $("micBtn").setAttribute("aria-pressed", String(on));
  $("micLabel").textContent = on ? "Stop Talking" : "Start Talking";
  if (on) vizStart(); else vizStop();
});
</script>
</body>
</html>
